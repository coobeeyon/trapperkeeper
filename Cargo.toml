[package]
name = "trapperkeeper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
